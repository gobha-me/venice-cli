name: publish

# Publishes venice-cli to PyPI via Trusted Publishing (OIDC) -- no API token is
# stored anywhere. Deliberately NOT triggered by a bare tag push: a PyPI version
# is immutable once uploaded, so production requires a published GitHub Release
# whose exact tag SHA has already passed the complete master test workflow.
# Manual dispatch is TestPyPI-only.
#
# Requires, one time, outside this repo:
#   - a pending publisher on pypi.org and test.pypi.org for project venice-cli
#     (owner gobha-me, repo venice-cli, workflow publish.yml, environment
#     pypi / testpypi respectively)
#   - GitHub Environments named `pypi` and `testpypi` (names must match exactly)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          # Pin the event's commit. For a release this is the commit recorded
          # for its tag; for TestPyPI it is the ref selected in the Actions UI.
          ref: ${{ github.sha }}

      - name: Require successful exact-SHA CI
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PYTHONPATH=src python scripts/verify_release.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --sha "$(git rev-parse HEAD)"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  ghcr:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish exact release image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.event.release.tag_name }}
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.created=${{ github.event.release.created_at }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.event.release.tag_name }}

      - name: Record immutable image digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "Published ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
