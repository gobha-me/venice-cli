name: test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The drive suite waits on a child process, so a genuine hang would
    # otherwise burn the full default budget before reporting.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Keep explicit supported-version legs plus a newest-stable guard. The
        # 3.x leg intentionally duplicates the current newest classifier until
        # the next CPython release, when it advances without a metadata gap.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.x"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # The chat/embed/shared_openai tests import the OpenAI SDK, and the
      # mcp-server wiring test imports the `mcp` SDK (both mock their clients,
      # but the modules must be importable), so CI installs the [all] extra. On
      # 3.9 the `mcp` marker resolves to nothing and those wiring tests skip;
      # the pure-logic MCP tests still run. No system packages are needed:
      # ffmpeg/montage shell-outs are mocked at subprocess/shutil.which.
      #
      # [test] adds pexpect for the #80 drive suite, which spawns the real CLI
      # on a pty against a loopback fake API. It skips itself when pexpect is
      # absent, so it is installed here on every matrix leg deliberately: this
      # is the only thing in the repo that exercises 3.9 through a real
      # terminal, and pinning it to one version would throw that away.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,test]"

      - name: Lint
        run: make lint

      # Its own step rather than only a unittest: `make test` covers it too,
      # but a named check that goes red on its own line is the difference
      # between "a test failed" and "someone pushed a hidden character."
      - name: Scan for invisible characters
        run: make scan

      - name: Test
        run: make test

  # Builds the distributions and proves the *base* install is dependency-free.
  # The test job above always installs the [openai] extra, so it cannot catch a
  # module-scope third-party import sneaking into a base command -- this job can.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*

      # Build/twine and their transitive dependencies stay in setup-python's
      # interpreter.  A default venv does not inherit those site-packages, so
      # importing the installed wheel here proves the base command graph is
      # genuinely stdlib-only rather than accidentally borrowing CI tooling.
      - name: Smoke the base wheel in a clean environment
        run: |
          SMOKE_VENV="${RUNNER_TEMP}/venice-base-wheel"
          python -m venv "$SMOKE_VENV"
          "$SMOKE_VENV/bin/python" -m pip install --no-deps dist/*.whl
          "$SMOKE_VENV/bin/python" - <<'PY'
          import importlib.metadata
          import importlib.util
          import re
          import sys

          if sys.prefix == sys.base_prefix:
              raise SystemExit("base-wheel smoke is not running in an isolated venv")

          forbidden = (
              "build", "twine", "requests", "urllib3", "keyring", "rich",
              "openai", "mcp",
          )
          present = [name for name in forbidden if importlib.util.find_spec(name)]
          if present:
              raise SystemExit(
                  "third-party modules are visible in the base-wheel venv: "
                  + ", ".join(present)
              )

          requirements = importlib.metadata.requires("venice-cli") or []
          unconditional = [
              requirement for requirement in requirements
              if re.search(r"\bextra\s*==", requirement) is None
          ]
          if unconditional:
              raise SystemExit(
                  "base wheel has unconditional Requires-Dist entries: "
                  + ", ".join(unconditional)
              )

          from venice.cli import build_parser

          build_parser()
          print("ok: isolated base wheel has optional-only metadata and a clean command graph")
          PY
          "$SMOKE_VENV/bin/venice" --version
          "$SMOKE_VENV/bin/venice" --help >/dev/null
          "$SMOKE_VENV/bin/venice" completion bash >/dev/null
