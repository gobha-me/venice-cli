name: OpenAPI drift

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the script-only YAML parser
        run: python -m pip install -r scripts/openapi-requirements.txt

      - name: Compare implemented operations with the official Swagger
        run: |
          python scripts/openapi_contract.py check-live \
            --github-summary \
            --report openapi-drift.md

      - name: Upload the normalized drift report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openapi-drift-report
          path: openapi-drift.md
          if-no-files-found: ignore
