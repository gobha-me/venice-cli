apiVersion: v1
kind: ConfigMap
metadata:
  name: venice-mcp
data:
  VENICE_MCP_PUBLIC_URL: https://mcp.example.com/mcp
  VENICE_MCP_OAUTH_ISSUER: https://auth.example.com
  VENICE_MCP_OAUTH_JWKS_URL: https://auth.example.com/.well-known/jwks.json
  VENICE_MCP_OAUTH_AUDIENCE: https://mcp.example.com
  VENICE_MCP_OAUTH_SCOPES: venice:mcp
  VENICE_MCP_MEDIA_DIR: /srv/venice-media
  VENICE_MCP_REMOTE_MAX_SPEND: "0.10"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: venice-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: venice-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: venice-mcp
    spec:
      # The SQLite/filesystem media store is deliberately single-writer.
      # Keep replicas=1 and use a ReadWriteOnce volume.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: venice-mcp
          # Replace VERSION with a release tag or, preferably, pin its published digest.
          image: ghcr.io/gobha-me/venice-cli:VERSION
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: venice-mcp
          env:
            - name: VENICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: venice-mcp-api-key
                  key: VENICE_API_KEY
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: media
              mountPath: /srv/venice-media
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: media
          persistentVolumeClaim:
            claimName: venice-mcp-media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: venice-mcp-media
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: venice-mcp
spec:
  selector:
    app.kubernetes.io/name: venice-mcp
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: venice-mcp
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: traefik
  tls:
    - hosts: [mcp.example.com]
      secretName: venice-mcp-tls
  rules:
    - host: mcp.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: venice-mcp
                port:
                  name: http
