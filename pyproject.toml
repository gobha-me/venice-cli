[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "venice-cli"
dynamic = ["version"]
description = "A stdlib-only Python CLI for the Venice.ai API: audio, video, images, chat, and embeddings."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jeffrey Smith" }]
keywords = [
  "venice",
  "venice-ai",
  "cli",
  "tts",
  "text-to-image",
  "text-to-video",
  "embeddings",
  "llm",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Utilities",
]

# The base package has no required third-party dependencies. Optional SDKs are
# lazy-imported at the command/tool feature boundary and declared as extras
# below, so `pip install venice-cli` keeps a dependency-free command graph even
# though invoking those model/MCP-backed features requires the relevant extra.
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.40"]
# The MCP server (`venice mcp-serve`) uses the FastMCP server from the `mcp` SDK.
# The SDK requires Python >=3.10, so the dep is gated by an environment marker:
# on 3.9 the extra resolves to nothing (the CLI stays 3.9-compatible; only this
# one optional command needs 3.10+). Imported lazily, like the openai extra.
# Upper-bounded as of 2026-07-29 (#95): mcp 2.0.0, published 2026-07-28, deletes
# `mcp.server.fastmcp` -- `mcp.server` now exposes `mcpserver` instead. The old
# unbounded `mcp>=1.2` turned that into a red CI on every branch within the hour,
# on 3.10-3.13 only (2.0 declares requires-python >=3.10, so the 3.9 job kept
# resolving 1.x and stayed green). 1.29.0 is the current 1.x and still ships
# FastMCP. Lift this when `mcp_serve.py` is ported to the 2.x server API.
mcp = ["mcp>=1.2,<2; python_version>='3.10'"]
# Test-only: `pexpect` drives the real CLI on a pty in tests/test_drive_cli.py.
# Deliberately NOT in `all` -- `all` is a *runtime* install, and the CI `package`
# job's "a base install pulls in nothing third-party" proof must stay meaningful.
# The drive suite skips itself when pexpect is absent, so this extra is never
# required to get a green `make test`.
test = ["pexpect>=4.8"]
all = ["venice-cli[openai]", "venice-cli[mcp]"]

[project.scripts]
venice = "venice.cli:main"

[project.urls]
Homepage = "https://github.com/gobha-me/venice-cli"
Repository = "https://github.com/gobha-me/venice-cli"
Issues = "https://github.com/gobha-me/venice-cli/issues"
Changelog = "https://github.com/gobha-me/venice-cli/releases"

[tool.hatch.version]
path = "src/venice/__init__.py"

# Dist name (venice-cli) differs from the import package (venice), so the
# wheel target must be named explicitly -- the default heuristic looks for
# src/venice_cli and fails.
[tool.hatch.build.targets.wheel]
packages = ["src/venice"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/scripts",
  "/contracts",
  "/bin",
  "/Makefile",
  "/install.sh",
  "/uninstall.sh",
  "/README.md",
  "/LICENSE",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
]
